<div id="panel">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="cube" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-4m5 4V7m5 9v-6"/></symbol>
  <symbol id="settings-icon" viewBox="0 0 24 24"><path d="M3 6h8m4 0h6M3 12h2m4 0h12M3 18h12m4 0h2"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
</svg>
<header><b class="brand"><svg><use href="#cube"/></svg>Codex Supervisor</b><span class="bridge"><i id="lamp"></i><span id="bridge-label">待启动</span></span>
<nav><button id="back" hidden>主页</button><button id="usage-nav" aria-label="用量统计" title="用量统计"><svg><use href="#chart"/></svg></button><button id="prefs-nav" aria-label="设置" title="设置"><svg><use href="#settings-icon"/></svg></button></nav></header>
<main>

<section id="standby">
<section id="home-config"><h3>当前会话 <span class="scope-badge" id="sync-badge">跟随默认</span></h3>
<div id="session-config">
<label>工作模型<select id="session-model" disabled><option value="">跟随默认设置</option></select></label>
<label>思考强度<select id="session-effort" disabled><option value="">跟随默认设置</option></select></label>
<small>修改后将在下一轮生效，全局默认在右上角设置。</small>
</div></section>
<div class="home-right"><section><h3>当前对话 <span class="scope-badge" id="binding-badge">待派单</span></h3>
<button id="current-card" hidden><i id="current-dot"></i><span class="current-body"><strong id="current-name"></strong><small id="current-meta"></small></span><span class="enter">进入 ›</span></button>
<p id="unbound">尚未关联 Codex 会话，左侧发送任务后自动绑定</p></section>
<section id="history"><h3>最近监管会话</h3><div id="recent"><small>暂无监管会话</small></div></section></div></section>
<section id="thread" hidden><div class="session-row"><span id="status-dot" class="dot"></span><select id="session-select" class="session-select" aria-label="切换 Codex 会话"></select></div>
      <div class="meta-bar">
        <div id="meta-chips" class="meta-chips"></div>
        <div id="detail-mode" class="segmented" role="group" aria-label="内容详略档位">
          <button type="button" class="seg-btn" data-mode="concise" title="仅显示核心双边对话">简洁</button>
          <button type="button" class="seg-btn on" data-mode="default" title="核心对话 + 过程说明与计划（不含工具调用）">默认</button>
          <button type="button" class="seg-btn" data-mode="detailed" title="全部展开（含命令、文件改动及其他工具调用）">详细</button>
        </div>
      </div>
    <div id="chat-scroll" class="chat-scroll" aria-live="polite">
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-title">暂无监管会话记录</div>
        <div class="empty-desc">在对话里让我派 Codex 干活后，双方的派单、插队、阶段汇报和验收回复会实时显示在这里。</div>
      </div>

      <div id="chat-list" class="chat-list"></div>

      <div id="live-indicator" class="live-indicator hidden">
        <div class="bubble bubble-codex bubble-live">
          <div class="bubble-head">
            <span class="role-name">Codex</span>
            <span class="badge tone-teal">执行中</span>
            <span id="live-model-sub" class="meta-sub hidden"></span>
            <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
          <div id="live-draft" class="bubble-body"></div>
        </div>
      </div>
    </div>

    <button type="button" id="scroll-bottom-btn" class="scroll-btn hidden" title="回到最新消息">↓ 最新消息</button>
</section>
<section id="prefs" hidden><h2>常规设置</h2><div id="selectors"><label id="model-feedback">全局默认工作模型<select id="model-select" disabled><option>跟随 Codex</option></select></label>
<label>全局默认思考强度<select id="effort-select" disabled><option>跟随 Codex</option></select></label></div><label><input id="open-desktop" type="checkbox" disabled> 派单后打开 Codex 桌面会话</label><p><button id="check-now">检查更新</button></p><small id="check-status" role="status"></small></section>
<section id="usage" hidden><h2>监管会话用量</h2><div id="usage-periods"></div><small id="usage-coverage"></small><h3>近一年每日 Token</h3><div id="heatmap"></div><p id="day-detail"></p></section>
<small id="general-status" role="status"></small><small id="error" role="alert"></small>
</main><footer><span id="sync">项目自动同步 · 待启动</span><button id="update-btn" hidden>更新</button><span id="version"><!-- VERSION --></span></footer>
</div>
<dialog id="update-dialog" aria-labelledby="update-title"><h2 id="update-title">插件更新</h2><dl><dt>当前版本</dt><dd id="installed"></dd><dt>最新版本</dt><dd id="latest"></dd><dt>提交摘要</dt><dd id="commit"></dd></dl>
<p id="install-state" role="status"></p><div class="actions"><button id="ignore">忽略本版本</button><button id="cancel" autofocus>取消</button><button id="install">更新</button></div></dialog>
