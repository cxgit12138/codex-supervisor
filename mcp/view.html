<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Supervisor</title><style>/* STYLE */</style></head>
<body><div id="panel">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="cube" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="m7 8 4 3-4 3m6 0h4M8 21h8"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-4m5 4V7m5 9v-6"/></symbol>
  <symbol id="settings-icon" viewBox="0 0 24 24"><path d="M3 6h8m4 0h6M3 12h2m4 0h12M3 18h12m4 0h2"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
</svg>
<header><b class="brand"><svg><use href="#cube"/></svg>Codex Supervisor</b><span class="bridge"><i id="lamp"></i><span id="bridge-label">待启动</span></span>
<nav><button id="usage-nav" aria-label="用量统计" title="用量统计"><svg><use href="#chart"/></svg></button><button id="prefs-nav" aria-label="设置" title="设置"><svg><use href="#settings-icon"/></svg></button></nav></header>
<main>
<button id="back" hidden>返回</button>
<section id="standby">
<div class="hero"><svg class="terminal"><use href="#terminal"/></svg><h2>当前对话尚未派单</h2>
<p>在左侧发送开发任务后，这里会自动绑定并展示 Codex 的执行进度与回复。</p>
<div class="steps"><span>1. 左侧发需求</span><svg><use href="#arrow"/></svg><span>2. 自动建会话</span><svg><use href="#arrow"/></svg><span>3. 实时监工</span></div></div>
<div id="home-config"><div id="selectors"><label id="model-feedback">默认工作模型<select id="model-select" disabled><option>跟随 Codex</option></select></label>
<label>默认思考强度<select id="effort-select" disabled><option>跟随 Codex</option></select></label></div></div>
<h3>最近监管会话</h3><div id="recent"><small>暂无监管会话</small></div></section>
<section id="thread" hidden><h2 id="title"></h2><p id="status"></p><div id="messages"></div></section>
<section id="prefs" hidden><h2>常规设置</h2><div id="prefs-config"></div><label><input id="open-desktop" type="checkbox" disabled> 派单后打开 Codex 桌面会话</label></section>
<section id="usage" hidden><h2>监管会话用量</h2><div id="usage-periods"></div><small id="usage-coverage"></small><h3>近一年每日 Token</h3><div id="heatmap"></div><p id="day-detail"></p></section>
<small id="general-status" role="status"></small><small id="error" role="alert"></small>
</main><footer><span id="sync">项目自动同步 · 待启动</span><button id="update-btn" hidden>更新</button><span id="version"><!-- VERSION --></span></footer>
</div>
<dialog id="update-dialog" aria-labelledby="update-title"><h2 id="update-title">插件更新</h2><dl><dt>当前版本</dt><dd id="installed"></dd><dt>最新版本</dt><dd id="latest"></dd><dt>提交摘要</dt><dd id="commit"></dd></dl>
<p id="install-state" role="status"></p><div class="actions"><button id="ignore">忽略本版本</button><button id="cancel" autofocus>取消</button><button id="install">更新</button></div></dialog>
<script>/* SCRIPT */</script></body></html>
