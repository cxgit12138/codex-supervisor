name: Package Supervisor
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release files
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=latest
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          python3 lib/release.py pack . "$RUNNER_TEMP/package" "$GITHUB_SHA" "$tag"
      - name: Publish ZIP and manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_TAG" == latest ]]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$tip" != "$GITHUB_SHA" ]]; then exit 0; fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            fi
            flag=--latest=false
          else
            flag=--latest
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Codex Supervisor" "$flag"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/package/codex-supervisor.zip" --clobber
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/package/release-manifest.json" --clobber
