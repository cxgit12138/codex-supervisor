<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Supervisor</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <!-- Top bar: session switcher & controls -->
    <header class="topbar">
      <div class="session-row">
        <span id="status-dot" class="dot dot-idle" title="会话状态"></span>
        <select id="session-select" class="session-select" aria-label="切换 Codex 会话">
          <option value="">正在加载会话…</option>
        </select>
        <button type="button" id="settings-btn" class="settings-toggle" aria-controls="settings-panel" aria-expanded="false">设置</button>
        <button type="button" id="refresh-btn" class="icon-btn" title="立即刷新">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.7"/>
            <path d="M13.5 3v2.8h-2.8"/>
          </svg>
        </button>
      </div>

      <div class="meta-bar">
        <div id="meta-chips" class="meta-chips"></div>
        <div id="detail-mode" class="segmented" role="group" aria-label="内容详略档位">
          <button type="button" class="seg-btn" data-mode="minimal" title="仅显示核心双边对话">简洁</button>
          <button type="button" class="seg-btn on" data-mode="default" title="核心对话 + 过程说明与计划（不含工具调用）">默认</button>
          <button type="button" class="seg-btn" data-mode="detailed" title="全部展开（含命令、文件改动及其他工具调用）">详细</button>
        </div>
      </div>
    </header>

    <section id="settings-panel" hidden aria-label="插件设置">
      <nav id="settings-nav" aria-label="设置分类">
        <button type="button" data-page="general" aria-pressed="true">常规设置</button>
        <button type="button" data-page="usage">用量统计</button>
        <button type="button" data-page="update">更新</button>
      </nav>
      <div id="page-general" class="settings-page">
        <label for="model-select">默认工作模型</label>
        <div id="model-feedback"><select id="model-select" class="session-select"></select></div>
        <label for="effort-select">默认思考强度</label>
        <select id="effort-select" class="session-select"></select>
        <label class="check-row"><input type="checkbox" id="open-desktop">派单、续发或插队后打开 Codex 桌面会话</label>
        <p id="general-status" role="status"></p>
      </div>
      <div id="page-usage" class="settings-page" hidden>
        <h2>监管会话用量</h2>
        <div id="usage-periods"></div>
        <small id="usage-coverage"></small>
        <h3>近一年每日 Token</h3>
        <div id="heatmap" aria-label="每日 Token 热力图"></div>
        <p id="day-detail" role="status"></p>
      </div>
      <div id="page-update" class="settings-page" hidden>
        <h2>插件更新</h2>
        <p id="update-version"></p>
        <button type="button" id="check-update">检查更新</button>
        <button type="button" id="install-update" disabled>立即更新</button>
        <p id="update-status" role="status"></p>
      </div>
      <p id="settings-error" role="alert"></p>
    </section>

    <!-- Chat stream: Left = Codex, Right = Antigravity Supervisor -->
    <main id="chat-scroll" class="chat-scroll" aria-live="polite">
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-title">暂无监管会话记录</div>
        <div class="empty-desc">在对话里让我派 Codex 干活后，双方的派单、插队、阶段汇报和验收回复会实时显示在这里。</div>
      </div>

      <div id="chat-list" class="chat-list"></div>

      <div id="live-indicator" class="live-indicator hidden">
        <div class="bubble bubble-codex bubble-live">
          <div class="bubble-head">
            <span class="role-name">Codex</span>
            <span class="badge tone-teal">执行中</span>
            <span id="live-model-sub" class="meta-sub hidden"></span>
            <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
          <div id="live-draft" class="bubble-body"></div>
        </div>
      </div>
    </main>

    <button type="button" id="scroll-bottom-btn" class="scroll-btn hidden" title="回到最新消息">↓ 最新消息</button>
  </div>

  <script src="./app.js"></script>
  <script src="./settings.js"></script>
</body>
</html>
